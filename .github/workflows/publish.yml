name: Publish to npm

# Publishes @runonflux/bitcoinjs-message from CI with npm trusted publishing
# (OIDC) and a signed provenance attestation, so consumers can check that a
# given npm version was built from this repository at a given tag
# (`npm audit signatures`). There is no long-lived npm token anywhere: npm
# exchanges this job's short-lived GitHub OIDC token for a publish credential,
# and only for the repo + workflow file + environment configured as the
# package's trusted publisher on npmjs.com.
#
# Release: bump package.json "version", merge to master, then push tag vX.Y.Z.
on:
  push:
    tags: ['v*']

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: verify, test, publish (provenance)
    runs-on: ubuntu-latest
    # Required reviewers + "selected tags: v*" are configured on this
    # environment in the repo settings; the npm trusted publisher is bound to it.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      # No dependency caches in this job: a release must not restore state
      # written by other workflow runs (cache poisoning).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pinned exactly.
      - name: Pin npm
        run: npm install -g --ignore-scripts npm@11.19.1 && npm --version

      - name: Tag must equal package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      # Lifecycle scripts of dependencies never run on the release runner
      # (secp256k1 falls back to its pure-JS elliptic implementation).
      - run: npm ci --ignore-scripts
      # Unit suite (tape). `npm test` additionally runs `standard`, which does
      # not pass on the current tree; switch to `npm test` once it does.
      - name: Unit tests
        run: npm run unit

      # Ships index.js/index.d.ts as-is (no build step). --ignore-scripts also
      # skips the legacy `prepublish` hook (it only re-runs the tests).
      - name: Stage publish with provenance (maintainer approves on npm)
        # Staged publishing: CI uploads the version (with provenance) but it is
        # NOT live until a maintainer approves it with 2FA on npmjs.com or via
        # `npm stage approve <stage-id>`. The npm trusted publisher is configured
        # without 'Allow npm publish', so a direct `npm publish` would be refused.
        run: npm stage publish --provenance --access public --ignore-scripts
